<div class="container">
    <h1>Catálogo de préstamos</h1>

    <div class="filters">
        <form>
            <mat-form-field>
                <mat-label>Título del préstamo</mat-label>
                <input
                    type="text"
                    matInput
                    placeholder="Título del préstamo"
                    [(ngModel)]="filterTitle"
                    name="title"
                />
            </mat-form-field>

            <mat-form-field>
                <mat-label>Categoría del préstamo</mat-label>
                <mat-select disableRipple [(ngModel)]="filterCategory" name="category">
                    @for (category of categories; track category.id) {
                        <mat-option [value]="category">{{ category.name }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </form>

        <div class="buttons">
            <button mat-stroked-button (click)="onCleanFilter()">Limpiar</button>
            <button mat-stroked-button (click)="onSearch()">Filtrar</button>
        </div>
    </div>

    <div class="prestamo-list">
        @for (prestamo of prestamos; track prestamo.id) {
            <app-prestamo-item (click)="editPrestamo(prestamo)" />
        }
    </div>

    <div class="buttons">
        <button mat-flat-button color="primary" (click)="createPrestamo()">
            Nuevo préstamo
        </button>
    </div>
</div>
